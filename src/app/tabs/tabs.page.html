<!-- Contenedor de pestañas de Ionic -->
<ion-tabs>
  <!-- Barra inferior con los tres botones -->
  <ion-tab-bar slot="bottom">
    <!-- Pestaña 1: Inicio (El mundo del monstruo) -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="flash"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <!-- Pestaña 2: Historia (Secretos y leyendas) -->
    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="skull"></ion-icon>
      <ion-label>Historia</ion-label>
    </ion-tab-button>

    <!-- Pestaña 3: Galería (El rincón del terror) -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="images"></ion-icon>
      <ion-label>Galería</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
