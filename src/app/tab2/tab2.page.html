<!-- Cabecera de la pestaña -->
<ion-header>
  <ion-toolbar>
    <ion-title>Historia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- @for repite la tarjeta una vez por cada ficha de la lista del .ts.
       Cada tarjeta recibe un contenido distinto mediante @Input(). -->
  @for (ficha of fichas; track ficha.titulo) {
    <lib-monster-card
      [titulo]="ficha.titulo"
      [texto]="ficha.texto"
      [textoBoton]="ficha.textoBoton"
      (botonPulsado)="alPulsar(ficha)"
    />
  }
</ion-content>
