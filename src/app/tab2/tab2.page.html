<ion-header>
  <ion-toolbar>
    <ion-title>Historia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Contenedor en rejilla: las tarjetas se colocan de 2 en 2 (estilos en tab2.page.scss) -->
  <div class="rejilla">
    @for (ficha of fichas; track ficha.titulo) {
      <lib-monster-card
        [titulo]="ficha.titulo"
        [texto]="ficha.texto"
        [textoBoton]="ficha.textoBoton"
        (botonPulsado)="alPulsar(ficha)"
      />
    }
  </div>
</ion-content>
