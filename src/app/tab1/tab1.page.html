<!-- Cabecera de la pestaña -->
<ion-header>
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Contenido de la pestaña -->
<ion-content>
  <!-- Tarjeta de la librería.
       - Los corchetes [texto] pasan una variable de la página (textoInicio, del .ts).
       - Los atributos sin corchetes pasan texto fijo.
       - (botonPulsado) escucha el clic del botón y ejecuta alPulsarTarjeta(). -->
  <lib-monster-card
    imagen="assets/frankenstein.jpg"
    titulo="El Monstruo de Frankenstein"
    [texto]="textoInicio"
    textoBoton="Entrar al laboratorio"
    (botonPulsado)="alPulsarTarjeta()"
  />
</ion-content>
