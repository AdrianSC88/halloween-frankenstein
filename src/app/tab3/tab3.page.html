<ion-header>
  <ion-toolbar>
    <ion-title>Galería</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Fila horizontal: las tarjetas van una al lado de otra (estilos en tab3.page.scss) -->
  <div class="galeria">
    @for (elemento of galeria; track elemento.titulo) {
      <lib-monster-card
        [imagen]="elemento.imagen"
        [titulo]="elemento.titulo"
        [texto]="elemento.texto"
        textoBoton="Ver más"
        (botonPulsado)="alPulsar(elemento)"
      />
    }
  </div>
</ion-content>
