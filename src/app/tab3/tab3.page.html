<!-- Cabecera de la pestaña -->
<ion-header>
  <ion-toolbar>
    <ion-title>Galería</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Una tarjeta por cada elemento de la galería, con su imagen, título y frase -->
  @for (elemento of galeria; track elemento.titulo) {
    <lib-monster-card
      [imagen]="elemento.imagen"
      [titulo]="elemento.titulo"
      [texto]="elemento.texto"
      textoBoton="Ver más"
      (botonPulsado)="alPulsar(elemento)"
    />
  }
</ion-content>
